# Refreshes data/publications.json from ORCID and OpenAlex every Monday,
# and opens a pull request if anything changed so a person can check it first.
name: Update publications

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/fetch_publications.py
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update-publications
          commit-message: Update publications from ORCID and OpenAlex
          title: Update publications
          body: Weekly refresh of `data/publications.json`. Check that the new entries belong to the group, then merge to publish them.
          add-paths: data/publications.json
          delete-branch: true
