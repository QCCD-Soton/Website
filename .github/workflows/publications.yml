# Refreshes data/publications.json from ORCID and OpenAlex every Monday. If anything
# changed, it pushes the update to the update-publications branch and opens (or updates)
# a "Publications update ready" issue, assigned to ASSIGNEE, with a link to open the
# pull request, so a person can check it first. Actions can't open pull requests in this
# organisation, so the issue does the notifying instead.
name: Update publications

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

env:
  BRANCH: update-publications
  ISSUE_TITLE: Publications update ready
  ASSIGNEE: Oliver-Johnson

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/fetch_publications.py

      - name: Push the update and open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --state open --author "app/github-actions" --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)

          # Nothing differs from main: the last update was merged (or is no longer needed).
          if git diff --quiet -- data/publications.json; then
            echo "No changes to publications." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "The publications on main are up to date now, so this is no longer needed."
            fi
            exit 0
          fi

          # Same update as last week, still waiting: leave the branch and the issue alone.
          if [ -n "$issue" ] && git fetch --quiet origin "$BRANCH" 2>/dev/null \
             && git diff --quiet FETCH_HEAD -- data/publications.json; then
            echo "Same update as last time, still waiting in issue #$issue." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git show HEAD:data/publications.json > "$RUNNER_TEMP/old.json"
          changes=$(python scripts/publications_changes.py "$RUNNER_TEMP/old.json" data/publications.json)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add data/publications.json
          git commit -m "Update publications from ORCID and OpenAlex"
          git push --force origin "$BRANCH"

          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          pr=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')

          # The issue body for issue number $1 (empty before the issue exists). The link
          # prefills the pull request's title and "Closes #N", so merging it closes the issue.
          make_body() {
            if [ -n "$pr" ]; then
              next="The pull request is already open and now has this update: $pr. Check it, then merge to publish."
            else
              link="$repo_url/compare/main...$BRANCH?expand=1&title=Update%20publications%20from%20ORCID%20and%20OpenAlex"
              if [ -n "$1" ]; then link="$link&body=Closes%20%23$1"; fi
              next="[Open the pull request]($link), check it, then merge to publish."
            fi
            printf '%s\n\n%s\n\n%s\n\n%s' \
              "The weekly refresh of \`data/publications.json\` found changes and pushed them to the \`$BRANCH\` branch." \
              "$changes" \
              "$next" \
              "This issue closes itself when the pull request is merged, or on the next run once main is up to date. [Workflow run]($repo_url/actions/runs/$GITHUB_RUN_ID)"
          }

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body "$(make_body "$issue")" --add-assignee "$ASSIGNEE"
            gh issue comment "$issue" --body "The update has changed since last time. The list above is now current."
          else
            # The issue's number is only known once it exists, so add the link's "Closes #N" after.
            url=$(gh issue create --title "$ISSUE_TITLE" --body "$(make_body "")" --assignee "$ASSIGNEE")
            issue="${url##*/}"
            gh issue edit "$issue" --body "$(make_body "$issue")"
          fi

          { echo "Publications changed, see the \"$ISSUE_TITLE\" issue."; echo; echo "$changes"; } >> "$GITHUB_STEP_SUMMARY"
